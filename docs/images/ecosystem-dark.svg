<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">
  <title id="title">Tiffin Edge ecosystem</title>
  <desc id="desc">A declarative Apache APISIX profile for REST and gRPC. Three connected groups show clients, declarative edge, service plane.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#0ea5e9" stop-opacity=".18"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2a3b52" stroke-opacity=".26"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020611" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6366f1"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#08111f"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1030" cy="70" r="270" fill="url(#glow)"/>
  <g transform="translate(72 54)">
    <rect width="62" height="62" rx="18" fill="url(#accent)"/>
    <text x="31" y="40" text-anchor="middle" fill="#091018" font-size="23" font-weight="900">AX</text>
    <text x="84" y="27" fill="#f3f7fc" font-size="30" font-weight="850">Tiffin Edge</text>
    <text x="84" y="54" fill="#9aa9bc" font-size="16" font-weight="520">A declarative Apache APISIX profile for REST and gRPC</text>
  </g>
  <g transform="translate(72 143)">
    <text fill="#f3f7fc" font-size="23" font-weight="760">One reviewed edge. No runtime route drift. No implicit trust.</text>
    <rect x="0" y="25" width="1088" height="2" rx="1" fill="url(#accent)" opacity=".55"/>
  </g>
  <g filter="url(#shadow)">
      <rect x="72" y="218" width="284" height="244" rx="24" fill="#101c2d" stroke="#2a3b52"/>
      <text x="94" y="249" fill="#9aa9bc" font-size="12" font-weight="800" letter-spacing="1.8">CLIENTS</text>
      <g>
        <rect x="90" y="266" width="248" height="82" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="90" y="266" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="110" y="295" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">CUSTOMER</text>
        <text x="110" y="320" fill="#f3f7fc" font-size="16" font-weight="650">Anonymous and protected REST</text>
      </g><g>
        <rect x="90" y="360" width="248" height="82" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="90" y="360" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="110" y="389" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">OPERATIONS</text>
        <text x="110" y="414" fill="#f3f7fc" font-size="16" font-weight="650">Protected REST and gRPC</text>
      </g>
    </g><g filter="url(#shadow)">
      <rect x="414" y="218" width="356" height="328" rx="24" fill="#101c2d" stroke="#2a3b52"/>
      <text x="436" y="249" fill="#9aa9bc" font-size="12" font-weight="800" letter-spacing="1.8">DECLARATIVE EDGE</text>
      <g>
        <rect x="432" y="266" width="320" height="60" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="432" y="266" width="5" height="60" rx="2.5" fill="url(#accent)"/>
        <text x="452" y="295" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">TLS</text>
        <text x="452" y="320" fill="#f3f7fc" font-size="16" font-weight="650">Local termination</text>
      </g><g>
        <rect x="432" y="334" width="320" height="60" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="432" y="334" width="5" height="60" rx="2.5" fill="url(#accent)"/>
        <text x="452" y="363" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">REQUEST ID</text>
        <text x="452" y="388" fill="#f3f7fc" font-size="16" font-weight="650">End-to-end correlation</text>
      </g><g>
        <rect x="432" y="402" width="320" height="60" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="432" y="402" width="5" height="60" rx="2.5" fill="url(#accent)"/>
        <text x="452" y="431" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">AUTH SWITCH</text>
        <text x="452" y="456" fill="#f3f7fc" font-size="16" font-weight="650">Backend-only or Keycloak</text>
      </g><g>
        <rect x="432" y="470" width="320" height="60" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="432" y="470" width="5" height="60" rx="2.5" fill="url(#accent)"/>
        <text x="452" y="499" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">LIMIT</text>
        <text x="452" y="524" fill="#f3f7fc" font-size="16" font-weight="650">Bounded anonymous reads</text>
      </g>
    </g><g filter="url(#shadow)">
      <rect x="828" y="218" width="356" height="338" rx="24" fill="#101c2d" stroke="#2a3b52"/>
      <text x="850" y="249" fill="#9aa9bc" font-size="12" font-weight="800" letter-spacing="1.8">SERVICE PLANE</text>
      <g>
        <rect x="846" y="266" width="320" height="82" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="846" y="266" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="295" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">8 ROUTES</text>
        <text x="866" y="320" fill="#f3f7fc" font-size="16" font-weight="650">Public business boundaries</text>
      </g><g>
        <rect x="846" y="360" width="320" height="82" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="846" y="360" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="389" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">PAYMENTS</text>
        <text x="866" y="414" fill="#f3f7fc" font-size="16" font-weight="650">Internal-only gRPC</text>
      </g><g>
        <rect x="846" y="454" width="320" height="82" rx="16" fill="#17263a" stroke="#2a3b52"/>
        <rect x="846" y="454" width="5" height="82" rx="2.5" fill="url(#accent)"/>
        <text x="866" y="483" fill="#0ea5e9" font-size="13" font-weight="800" letter-spacing="1.2">SERVICES</text>
        <text x="866" y="508" fill="#f3f7fc" font-size="16" font-weight="650">Validate every token again</text>
      </g>
    </g>
  <path d="M356 410 C382 410 388 410 410 410" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 410 C792 410 802 410 824 410" stroke="#6366f1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <g><g><circle cx="79" cy="585" r="5" fill="#0ea5e9"/><text x="93" y="590" fill="#9aa9bc" font-size="12" font-weight="750" letter-spacing="1">STANDALONE YAML</text></g><g><circle cx="439" cy="585" r="5" fill="#6366f1"/><text x="453" y="590" fill="#9aa9bc" font-size="12" font-weight="750" letter-spacing="1">NO ADMIN API DRIFT</text></g><g><circle cx="799" cy="585" r="5" fill="#0ea5e9"/><text x="813" y="590" fill="#9aa9bc" font-size="12" font-weight="750" letter-spacing="1">DEFENSE IN DEPTH</text></g></g>
  <text x="1208" y="590" text-anchor="end" fill="#9aa9bc" font-size="12" font-weight="650">PUBLIC REFERENCE · 2026</text>
</svg>